<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VuGen Web — Run Script + Snapshot</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen bg-[#0e1116] text-[#e6edf3] antialiased">
    <div class="flex h-screen flex-col overflow-hidden">
      <!-- ── Toolbar ── -->
      <header class="flex flex-wrap items-end gap-2.5 border-b border-[#232a33] bg-[#141922] px-4 py-3">
        <div class="mr-1 flex items-baseline gap-2">
          <span class="text-[13px] font-bold tracking-tight">VuGen Web</span>
          <span class="font-mono text-[10px] uppercase tracking-[0.08em] text-[#7d8896]">run + snapshot</span>
        </div>

        <!-- Zone 1: lokasi script (input + open + browse) -->
        <div class="flex min-w-[320px] flex-1 items-end gap-1.5">
          <div class="min-w-0 flex-1">
            <label for="scriptPath" class="mb-1 block font-mono text-[10px] font-medium uppercase tracking-[0.08em] text-[#7d8896]">Script folder</label>
            <input
              id="scriptPath"
              list="scriptPathHistory"
              placeholder="C:\path\to\script"
              spellcheck="false"
              class="h-8 w-full rounded-[3px] border border-[#232a33] bg-[#1b212b] px-2 font-mono text-[12.5px] text-[#e6edf3] outline-none placeholder:text-[#5b6572] focus:border-[#d2a24c]"
            />
            <datalist id="scriptPathHistory"></datalist>
          </div>
          <!-- ghost: action ringan, menjalankan isi input -->
          <button id="openBtn" type="button"
            class="h-8 shrink-0 rounded-[3px] border border-[#2a3644] bg-transparent px-3 text-[12px] font-medium text-[#c9d1d9] hover:border-[#3d4f63] hover:text-[#e6edf3] focus-visible:outline focus-visible:outline-[#d2a24c]">
            Open
          </button>
          <!-- text-button: shortcut convenience, bobot paling ringan -->
          <button id="browseBtn" type="button" title="Pilih script dari library server"
            class="h-8 shrink-0 rounded-[3px] border border-transparent px-2.5 text-[12px] font-medium text-[#7d8896] hover:border-[#2a3644] hover:text-[#c9d1d9] disabled:cursor-not-allowed disabled:opacity-40">
            Browse ↓
          </button>
        </div>

        <!-- Pemisah dua zone -->
        <div class="h-8 w-px shrink-0 self-end bg-[#2a3644]"></div>

        <!-- Zone 2: kontrol eksekusi (run / stop / resume) -->
        <div class="flex shrink-0 items-end gap-1.5">
          <!-- primary action: gold fill -->
          <button id="runBtn" type="button" disabled
            class="h-8 rounded-[3px] border border-[#d2a24c] bg-[#d2a24c] px-4 text-[12px] font-bold tracking-wide text-[#1c1200] hover:bg-[#e0b05a] disabled:cursor-not-allowed disabled:opacity-40">
            ▶ Run
          </button>
          <!-- destructive: merah saat aktif, redup saat disabled -->
          <button id="stopBtn" type="button" disabled
            class="h-8 rounded-[3px] border px-3 text-[12px] font-medium
                   border-red-900/70 text-red-400 hover:border-red-600 hover:text-red-300
                   disabled:cursor-not-allowed disabled:border-[#232a33] disabled:text-[#5b6572] disabled:opacity-30">
            ■ Stop
          </button>
          <!-- recovery: amber saat aktif, redup saat disabled -->
          <button id="resumeBtn" type="button" disabled
            class="h-8 rounded-[3px] border px-3 text-[12px] font-medium
                   border-[#d2a24c]/50 text-[#d2a24c] hover:border-[#d2a24c] hover:text-[#e0b05a]
                   disabled:cursor-not-allowed disabled:border-[#232a33] disabled:text-[#5b6572] disabled:opacity-30">
            Resume
          </button>
        </div>

        <div class="relative">
          <button id="runSettingsBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="runSettingsPanel"
            class="flex h-8 max-w-[360px] items-center gap-2 rounded-[3px] border border-[#232a33] bg-[#1b212b] px-3 text-[12px] font-medium hover:border-[#3a4553] aria-expanded:border-[#d2a24c]">
            <span class="shrink-0">Run settings</span>
            <span id="runSettingsSummary" class="min-w-0 truncate font-mono text-[10px] font-normal text-[#7d8896]"></span>
            <span class="shrink-0 text-[9px] text-[#7d8896]" aria-hidden="true">▾</span>
          </button>

          <div id="runSettingsPanel" role="dialog" aria-label="Run settings" tabindex="-1" hidden
            class="absolute left-0 top-full z-50 mt-1.5 w-[340px] rounded-[4px] border border-[#2a3644] bg-[#141922] shadow-[0_12px_32px_rgba(0,0,0,0.5)] outline-none">
            <p id="runSettingsLock" hidden class="border-b border-[#232a33] bg-[#1b212b] px-3 py-1.5 text-[11px] text-[#e3c664]">Locked while a run is in progress.</p>

            <div class="section-head border-b-0 pt-1">Iterations</div>
            <div class="px-3 pb-2">
              <label class="setting-row">
                <span class="setting-text"><span class="setting-name">Iterations</span><span class="setting-hint">How many times Run Logic repeats.</span></span>
                <input type="number" id="iterations" value="1" min="1" max="1000" class="ui-field w-20" />
              </label>
              <label class="setting-row">
                <span class="setting-text"><span class="setting-name">Delay between iterations</span><span class="setting-hint">Pause before the next iteration, in ms.</span></span>
                <input type="number" id="iterationDelay" value="0" min="0" max="60000" class="ui-field w-20" />
              </label>
              <label class="setting-row">
                <span class="setting-text"><span class="setting-name">New user each iteration</span><span class="setting-hint">Start with fresh cookies and session.</span></span>
                <input type="checkbox" id="newUserEachIteration" checked class="ui-toggle" />
              </label>
              <label class="setting-row">
                <span class="setting-text"><span class="setting-name">Continue on error</span><span class="setting-hint">Keep running after a failed step.</span></span>
                <input type="checkbox" id="continueOnError" class="ui-toggle" />
              </label>
            </div>

            <div class="section-head border-t border-b-0 pt-1">Network</div>
            <div class="px-3 pb-2">
              <label class="setting-row">
                <span class="setting-text"><span class="setting-name">Think time</span><span class="setting-hint">Run or skip lr_think_time pauses.</span></span>
                <select id="thinkTime" class="ui-field w-24">
                  <option value="ignore">Ignore</option>
                  <option value="run">Run</option>
                </select>
              </label>
              <label class="setting-row">
                <span class="setting-text"><span class="setting-name">Insecure TLS</span><span class="setting-hint">Accept self-signed or invalid certificates.</span></span>
                <input type="checkbox" id="insecureTLS" checked class="ui-toggle ui-toggle-warn" />
              </label>
            </div>
          </div>
        </div>

        <span id="status" data-state="checking" class="status-badge">…</span>
      </header>

      <!-- ── Tiga area: kiri ±20%, tengah fleksibel, kanan ±34% ── -->
      <main class="grid min-h-0 flex-1 grid-cols-[minmax(250px,20%)_minmax(0,1fr)_minmax(340px,28%)]">
        <!-- Kiri: FileTree (maks 38%) + StepList (sisanya) -->
        <aside class="flex min-h-0 flex-col border-r border-[#232a33] bg-[#121821]">
          <div class="flex max-h-[38%] min-h-0 shrink-0 flex-col">
            <div class="section-head">Script Files</div>
            <div id="fileTree" class="min-h-0 flex-1 overflow-auto px-2 py-2 text-[12px] text-[#5b6572]">No folder opened.</div>
          </div>
          <div id="paramsSectionBtn" hidden class="section-head border-t flex cursor-pointer items-center justify-between hover:bg-[#1a2030]">
            <span>Parameters</span>
            <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" class="text-[#5b6572]"><path d="M8 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path fill-rule="evenodd" d="M8 0a1 1 0 0 1 .894.553l.998 1.996a6.02 6.02 0 0 1 1.223.709l2.14-.535a1 1 0 0 1 1.098.48l1 1.732a1 1 0 0 1-.17 1.196l-1.55 1.55a6.13 6.13 0 0 1 0 1.638l1.55 1.55a1 1 0 0 1 .17 1.196l-1 1.732a1 1 0 0 1-1.097.48l-2.141-.534a6.02 6.02 0 0 1-1.223.708l-.998 1.996A1 1 0 0 1 8 16a1 1 0 0 1-.894-.553l-.998-1.996a6.02 6.02 0 0 1-1.223-.709l-2.14.535a1 1 0 0 1-1.098-.48l-1-1.732a1 1 0 0 1 .17-1.196l1.55-1.55a6.13 6.13 0 0 1 0-1.638L.617 5.13a1 1 0 0 1-.17-1.196l1-1.732a1 1 0 0 1 1.097-.48l2.141.534a6.02 6.02 0 0 1 1.223-.708L6.894.553A1 1 0 0 1 8 0Z"/></svg>
          </div>
          <div class="flex min-h-0 flex-1 flex-col">
            <div class="section-head border-t">Run Steps</div>
            <div id="stepList" class="min-h-0 flex-1 overflow-auto font-mono text-[12px] text-[#5b6572]"><div class="px-3 py-2">No run results yet.</div></div>
          </div>
        </aside>

        <!-- Tengah: Editor (tab per file) -->
        <section class="flex min-h-0 flex-col bg-[#0e1116]">
          <div id="tabBar" class="flex h-9 shrink-0 items-center gap-1 border-b border-[#232a33] bg-[#141922] px-2"></div>
          <div id="paramBar" class="hidden shrink-0 border-b border-[#232a33] bg-[#10151c] px-3 py-1.5"></div>
          <div id="editor" class="min-h-0 flex-1 overflow-hidden">
            <div class="grid h-full place-items-center text-[12px] text-[#5b6572]">No file opened.</div>
          </div>
        </section>

        <!-- Kanan: panel tab (Snapshot, Parameter, Log) -->
        <section class="flex min-h-0 flex-col border-l border-[#232a33] bg-[#141922]">
          <div id="panelTabBar" class="flex h-9 shrink-0 items-stretch border-b border-[#232a33] px-1"></div>
          <div class="min-h-0 flex-1 overflow-hidden" id="panelContainer">
            <div id="snapshotPanel" class="h-full"></div>
            <div id="parameterPanel" class="h-full hidden"></div>
            <div id="logPanel" class="h-full hidden"></div>
            <div id="transactionsPanel" class="h-full hidden"></div>
            <div id="toolboxPanel" class="h-full hidden"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
